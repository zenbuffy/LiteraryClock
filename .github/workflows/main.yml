name: generate-images

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install Python dependencies
      run: pip install pyyaml

    - name: Run Python tests
      run: python -m unittest test_insert_quote -v

  test-php:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install PHP extensions
      run: sudo apt-get install -y php-gd php-imagick

    - name: Install PHP dependencies
      run: composer install --optimize-autoloader

    - name: Run PHP tests
      run: vendor/bin/phpunit --no-coverage

  generate-images:
    runs-on: ubuntu-latest
    needs: [test-python, test-php]

    steps:
    - uses: actions/checkout@v2
      with:
        ref: ${{ github.head_ref }}

    - name: Install PHP extensions
      run: sudo apt-get install -y php-gd php-imagick

    - name: Install PHP dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Generate images
      run: |
        rm -rf images && \
        php quote_to_image.php

    - uses: stefanzweifel/git-auto-commit-action@v4
      with:
        file_pattern: 'images/*'
        skip_dirty_check: true
        commit_message: Update images dir
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  generate-data:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        ref: ${{ github.head_ref }}

    - name: Install Python dependencies
      run: pip install pyyaml

    - name: Generate JSON and CSV
      run: python yaml_to_formats.py

    - uses: stefanzweifel/git-auto-commit-action@v4
      with:
        file_pattern: 'litclock.json litclock_annotated_improved.csv'
        commit_message: Update generated data files
        repo-token: ${{ secrets.GITHUB_TOKEN }}
